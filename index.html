<style>
:root{
  --bg1:#eef2ff; --bg2:#f7eeff;
  --brand:#7c5cff; --brand-deep:#5b3fd6;
  --ink:#241c3b; --ink2:#6a6382; --line:#e7e3f5;
  --paper:#ffffff;
  --ok:#3ecf8e; --ok-deep:#1f9a68; --ok-soft:#e3faef;
  --bad:#ff5a6b; --bad-deep:#d8394b; --bad-soft:#ffe9ec;
  --warn:#ffb020; --warn-deep:#c47f00; --warn-soft:#fff4de;
  --mc1:#ff5a6b; --mc2:#4c86ff; --mc3:#ffb020; --mc4:#3ecf8e;
  --disp:"Fredoka","Pretendard",sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overscroll-behavior-y:none;}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",-apple-system,sans-serif;font-size:15px;line-height:1.6;min-height:100vh;}
h1,h2,h3{margin:0;font-family:var(--disp);font-weight:700;letter-spacing:-.01em;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
textarea,input{font-family:inherit;}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;overflow-x:hidden;}

/* topbar / hud */
.hud{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;}
.hud .back{width:34px;height:34px;border-radius:12px;background:#f2effc;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink2);flex:0 0 auto;}
.hud .barwrap{flex:1;height:12px;background:#eee7fb;border-radius:99px;overflow:hidden;}
.hud .barfill{height:100%;background:linear-gradient(90deg,var(--brand),#a78bff);border-radius:99px;transition:width .3s;}
.hud .hearts{display:flex;gap:2px;font-size:15px;flex:0 0 auto;}
.hud .streak{display:flex;align-items:center;gap:3px;font-family:var(--disp);font-weight:700;font-size:14px;color:var(--warn-deep);flex:0 0 auto;}

.content{flex:1;padding:16px 16px 40px;display:flex;flex-direction:column;}

/* ---------- home / setup ---------- */
.hero{text-align:center;padding:18px 10px 8px;}
.hero h1{font-size:26px;color:var(--brand-deep);}
.hero p{font-size:12.5px;color:var(--ink2);margin-top:4px;}

.link-badge{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin:14px 0;font-size:12px;}
.link-badge .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
.link-badge.on .dot{background:var(--ok);}
.link-badge.off .dot{background:var(--bad);}
.link-badge .t{flex:1;}
.link-badge .t b{display:block;font-size:12.8px;}
.link-badge button{font-size:11px;font-weight:800;color:var(--brand);background:#f2effc;border-radius:8px;padding:6px 10px;}

.card-select{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:13px 15px;margin-bottom:10px;display:flex;align-items:center;gap:12px;transition:.12s;}
.card-select.sel{border-color:var(--brand);background:#f7f4ff;}
.card-select .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;}
.card-select .body{flex:1;min-width:0;}
.card-select .name{font-weight:700;font-size:14px;}
.card-select .meta{font-size:11px;color:var(--ink2);margin-top:1px;}
.card-select .check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;}
.card-select.sel .check{background:var(--brand);border-color:var(--brand);position:relative;}
.card-select.sel .check:after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:900;}

.section-title{font-family:var(--disp);font-size:13px;font-weight:600;color:var(--ink2);margin:18px 0 8px 2px;}

.mode-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.mode-btn{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;font-size:11.5px;font-weight:700;}
.mode-btn .ic{font-size:22px;display:block;margin-bottom:4px;}
.mode-btn.sel{border-color:var(--brand);background:#f7f4ff;color:var(--brand-deep);}

.count-row{display:flex;gap:8px;}
.count-btn{flex:1;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px 0;text-align:center;font-weight:800;font-size:13.5px;}
.count-btn.sel{border-color:var(--brand);background:#f7f4ff;color:var(--brand-deep);}

.start-btn{margin-top:22px;background:linear-gradient(135deg,var(--brand),#9b7cff);color:#fff;border-radius:18px;padding:17px;font-family:var(--disp);font-weight:700;font-size:17px;box-shadow:0 8px 0 var(--brand-deep);}
.start-btn:active{transform:translateY(4px);box-shadow:0 4px 0 var(--brand-deep);}
.start-btn:disabled{background:#d8d3ee;box-shadow:0 8px 0 #c3bde0;color:#a49bcf;}

/* stats mini profile */
.stats-row{display:flex;gap:8px;margin-bottom:16px;}
.stat-chip{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;}
.stat-chip .v{font-family:var(--disp);font-size:19px;font-weight:700;color:var(--brand-deep);}
.stat-chip .l{font-size:10.5px;color:var(--ink2);margin-top:2px;}

/* import sheet */
.overlay{position:fixed;inset:0;background:rgba(36,28,59,.45);z-index:100;display:none;align-items:flex-end;justify-content:center;}
.overlay.show{display:flex;}
.sheet{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:20px 20px 26px;}
.sheet-hd{display:flex;align-items:center;margin-bottom:14px;}
.sheet-hd h3{flex:1;font-size:17px;}
.sheet-hd .x{width:30px;height:30px;border-radius:10px;background:#f2effc;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink2);}
.field textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:13px;background:#fbfbff;}
.sheet-btns{display:flex;gap:8px;margin-top:14px;}
.sheet-btns button{flex:1;border-radius:14px;padding:13px;font-weight:800;font-size:13.5px;}
.btn-secondary{background:#f2effc;color:var(--ink);}
.btn-primary{background:var(--brand);color:#fff;}
input[type=file]{display:none;}

/* ---------- playing ---------- */
.stage{flex:1;display:flex;flex-direction:column;}
.q-eyebrow{font-size:11px;font-weight:800;color:var(--ink2);text-align:center;letter-spacing:.04em;margin-bottom:8px;}
.q-card{background:var(--paper);border-radius:20px;padding:22px 20px;box-shadow:0 4px 20px rgba(90,70,160,.08);margin-bottom:16px;min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;}
.q-card .txt{font-size:17px;font-weight:600;white-space:pre-wrap;line-height:1.55;}
.mascot-corner{position:absolute;top:-18px;right:-6px;width:52px;height:52px;}

.mc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mc-opt{border-radius:16px;padding:16px 12px;color:#fff;font-weight:700;font-size:13px;text-align:left;display:flex;gap:9px;align-items:flex-start;box-shadow:0 5px 0 rgba(0,0,0,.15);min-height:76px;white-space:pre-wrap;}
.mc-opt:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.15);}
.mc-opt .shape{flex:0 0 auto;width:18px;height:18px;margin-top:1px;}
.mc-opt.c1{background:var(--mc1);} .mc-opt.c2{background:var(--mc2);} .mc-opt.c3{background:var(--mc3);} .mc-opt.c4{background:var(--mc4);}
.mc-opt.correct-flash{outline:4px solid #fff;}
.mc-opt.dim{opacity:.35;}
.mc-opt.wrong-flash{background:var(--bad-deep) !important;}

.sa-box textarea{width:100%;min-height:140px;border:2px solid var(--line);border-radius:16px;padding:14px 15px;font-size:14px;line-height:1.6;background:#fbfbff;}
.sa-box textarea:focus{outline:none;border-color:var(--brand);}
.sa-submit{margin-top:12px;background:linear-gradient(135deg,var(--brand),#9b7cff);color:#fff;border-radius:16px;padding:15px;font-family:var(--disp);font-weight:700;font-size:15px;box-shadow:0 6px 0 var(--brand-deep);width:100%;}
.sa-submit:active{transform:translateY(3px);box-shadow:0 3px 0 var(--brand-deep);}
.sa-submit:disabled{background:#d8d3ee;box-shadow:0 6px 0 #c3bde0;color:#a49bcf;}

.grading-wrap{text-align:center;padding:30px 0;}
.grading-wrap .spin{width:40px;height:40px;border:4px solid #e7e3f5;border-top-color:var(--brand);border-radius:50%;margin:0 auto 14px;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* feedback overlay */
.fb-overlay{position:fixed;inset:0;z-index:90;display:none;align-items:flex-end;justify-content:center;}
.fb-overlay.show{display:flex;}
.fb-sheet{width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 20px 26px;animation:slideup .25s ease-out;}
.fb-sheet.good{background:linear-gradient(180deg,#effcf4,#ffffff);}
.fb-sheet.bad{background:linear-gradient(180deg,#fff0f1,#ffffff);}
@keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.fb-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.fb-top .mascot{width:56px;height:56px;flex:0 0 auto;}
.fb-top .msg{flex:1;}
.fb-top .msg .h{font-family:var(--disp);font-size:19px;font-weight:700;}
.fb-sheet.good .h{color:var(--ok-deep);}
.fb-sheet.bad .h{color:var(--bad-deep);}
.fb-top .msg .s{font-size:12px;color:var(--ink2);margin-top:2px;}
.fb-detail{background:#fff;border-radius:14px;padding:13px 15px;font-size:13px;margin-bottom:10px;border:1px solid var(--line);}
.fb-detail .lbl{font-size:10.5px;font-weight:800;color:var(--ink2);letter-spacing:.04em;margin-bottom:5px;}
.fb-xp{display:inline-flex;align-items:center;gap:5px;background:#fff4de;color:var(--warn-deep);font-family:var(--disp);font-weight:700;font-size:13px;border-radius:999px;padding:5px 12px;margin-bottom:12px;}
.fb-next{width:100%;border-radius:16px;padding:15px;font-family:var(--disp);font-weight:700;font-size:15px;color:#fff;}
.fb-sheet.good .fb-next{background:linear-gradient(135deg,var(--ok),#2fb87a);box-shadow:0 6px 0 var(--ok-deep);}
.fb-sheet.bad .fb-next{background:linear-gradient(135deg,var(--bad),#e8465a);box-shadow:0 6px 0 var(--bad-deep);}
.fb-next:active{transform:translateY(3px);box-shadow:0 3px 0 currentColor;}
.self-grade-row{display:flex;gap:8px;margin-bottom:12px;}
.self-grade-row button{flex:1;border-radius:12px;padding:11px;font-weight:800;font-size:12.5px;}
.sg-yes{background:var(--ok-soft);color:var(--ok-deep);}
.sg-no{background:var(--bad-soft);color:var(--bad-deep);}
.ai-fail-note{font-size:11px;color:var(--ink2);background:#fff4de;border-radius:10px;padding:8px 11px;margin-bottom:10px;}

/* confetti */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:95;}

/* summary */
.summary-hero{text-align:center;padding:20px 10px;}
.summary-hero .mascot-big{width:110px;height:110px;margin:0 auto 10px;}
.summary-hero h2{font-size:24px;color:var(--brand-deep);}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.summary-stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 10px;text-align:center;}
.summary-stat .v{font-family:var(--disp);font-size:22px;font-weight:700;color:var(--brand-deep);}
.summary-stat .l{font-size:11px;color:var(--ink2);margin-top:3px;}
.wrong-list{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:6px 4px;margin-bottom:14px;}
.wrong-item{padding:10px 12px;border-bottom:1px solid var(--line);font-size:12.5px;}
.wrong-item:last-child{border-bottom:none;}
.wrong-item .f{font-weight:700;margin-bottom:2px;}
.wrong-item .b{color:var(--ink2);font-size:11.5px;}
.summary-btns{display:flex;flex-direction:column;gap:9px;}
.summary-btns button{border-radius:16px;padding:15px;font-family:var(--disp);font-weight:700;font-size:14.5px;}
.btn-star-all{background:var(--warn-soft);color:var(--warn-deep);}
.btn-replay{background:linear-gradient(135deg,var(--brand),#9b7cff);color:#fff;box-shadow:0 6px 0 var(--brand-deep);}
.btn-replay:active{transform:translateY(3px);box-shadow:0 3px 0 var(--brand-deep);}
.btn-home{background:#f2effc;color:var(--ink2);}

.empty{text-align:center;padding:40px 20px;color:var(--ink2);font-size:13px;}
.empty .big{font-size:40px;margin-bottom:10px;}
</style>
</head>
<body>
<div class="app" id="app"></div>
<canvas id="confetti"></canvas>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="fb-overlay" id="fbOverlay"><div class="fb-sheet" id="fbSheet"></div></div>

<script>
/* ============ MASCOT (original SVG character) ============ */
function mascotSVG(state, size){
  size = size || 60;
  const faces = {
    happy: `<circle cx="41" cy="47" r="4.2" fill="#241c3b"/><circle cx="63" cy="47" r="4.2" fill="#241c3b"/>
            <path d="M38 62 Q52 76 66 62" stroke="#241c3b" stroke-width="4" fill="none" stroke-linecap="round"/>
            <circle cx="30" cy="58" r="5" fill="#ff9fb0" opacity=".7"/><circle cx="74" cy="58" r="5" fill="#ff9fb0" opacity=".7"/>`,
    sad: `<circle cx="41" cy="49" r="4.2" fill="#241c3b"/><circle cx="63" cy="49" r="4.2" fill="#241c3b"/>
          <path d="M40 68 Q52 58 64 68" stroke="#241c3b" stroke-width="4" fill="none" stroke-linecap="round"/>`,
    neutral: `<circle cx="41" cy="48" r="4.2" fill="#241c3b"/><circle cx="63" cy="48" r="4.2" fill="#241c3b"/>
              <path d="M42 64 H62" stroke="#241c3b" stroke-width="4" fill="none" stroke-linecap="round"/>`,
    thinking: `<circle cx="41" cy="47" r="4.2" fill="#241c3b"/><circle cx="63" cy="45" r="4.2" fill="#241c3b"/>
              <path d="M42 66 Q52 60 62 63" stroke="#241c3b" stroke-width="4" fill="none" stroke-linecap="round"/>`,
  };
  return `<svg viewBox="0 0 104 104" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="52" cy="56" rx="42" ry="38" fill="#a78bff"/>
    <ellipse cx="52" cy="52" rx="42" ry="38" fill="#7c5cff"/>
    <ellipse cx="38" cy="26" rx="7" ry="10" fill="#7c5cff"/>
    <ellipse cx="66" cy="26" rx="7" ry="10" fill="#7c5cff"/>
    <circle cx="38" cy="24" r="4" fill="#a78bff"/><circle cx="66" cy="24" r="4" fill="#a78bff"/>
    ${faces[state]||faces.neutral}
  </svg>`;
}

/* ============ CONFETTI ============ */
const confettiCanvas = document.getElementById('confetti');
const cctx = confettiCanvas.getContext('2d');
function resizeConfetti(){ confettiCanvas.width=innerWidth; confettiCanvas.height=innerHeight; }
resizeConfetti(); window.addEventListener('resize', resizeConfetti);
let confettiParticles = [];
function burstConfetti(){
  const colors=['#7c5cff','#3ecf8e','#ffb020','#ff5a6b','#4c86ff'];
  for(let i=0;i<60;i++){
    confettiParticles.push({
      x: confettiCanvas.width/2 + (Math.random()-0.5)*80,
      y: confettiCanvas.height*0.35,
      vx:(Math.random()-0.5)*9, vy:-Math.random()*9-3,
      size:Math.random()*7+4, color:colors[Math.floor(Math.random()*colors.length)],
      rot:Math.random()*360, vr:(Math.random()-0.5)*14, life:100
    });
  }
  if(!confettiRunning) runConfetti();
}
let confettiRunning=false;
function runConfetti(){
  confettiRunning=true;
  cctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
  confettiParticles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.35; p.rot+=p.vr; p.life-=1.4;
    cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.rot*Math.PI/180);
    cctx.fillStyle=p.color; cctx.globalAlpha=Math.max(p.life/100,0);
    cctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
    cctx.restore();
  });
  confettiParticles = confettiParticles.filter(p=>p.life>0 && p.y<confettiCanvas.height+50);
  if(confettiParticles.length){ requestAnimationFrame(runConfetti); }
  else { confettiRunning=false; cctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height); }
}

/* ============ SOUND (Web Audio, no files) ============ */
let actx = null;
function sound(kind){
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const t0 = actx.currentTime;
    if(kind==='correct'){
      [523.25,659.25,783.99].forEach((f,i)=>{
        const o=actx.createOscillator(), g=actx.createGain();
        o.type='sine'; o.frequency.value=f;
        g.gain.setValueAtTime(0.0001,t0+i*0.08);
        g.gain.exponentialRampToValueAtTime(0.15,t0+i*0.08+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,t0+i*0.08+0.25);
        o.connect(g).connect(actx.destination);
        o.start(t0+i*0.08); o.stop(t0+i*0.08+0.3);
      });
    } else if(kind==='wrong'){
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='sawtooth'; o.frequency.setValueAtTime(180,t0); o.frequency.exponentialRampToValueAtTime(90,t0+0.25);
      g.gain.setValueAtTime(0.08,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.28);
      o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0+0.3);
    } else if(kind==='tap'){
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='sine'; o.frequency.value=700;
      g.gain.setValueAtTime(0.06,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.08);
      o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0+0.1);
    }
  }catch(e){}
}

/* ============ DATA LINKING ============ */
const CUECARDS_KEY = 'cho_cuecards_app_v1';
const SNAPSHOT_KEY = 'cho_quizquest_snapshot_v1';
const STATS_KEY = 'cho_quizquest_stats_v1';

function readCueData(){
  try{ const raw=localStorage.getItem(CUECARDS_KEY); if(raw) return {data:JSON.parse(raw), source:'live'}; }catch(e){}
  try{ const raw=localStorage.getItem(SNAPSHOT_KEY); if(raw) return {data:JSON.parse(raw), source:'snapshot'}; }catch(e){}
  return {data:null, source:'none'};
}
function saveSnapshot(data){ try{ localStorage.setItem(SNAPSHOT_KEY, JSON.stringify(data)); }catch(e){} }
function writeBackStars(cardIds){
  try{
    const raw = localStorage.getItem(CUECARDS_KEY);
    if(!raw) return false;
    const cue = JSON.parse(raw);
    cardIds.forEach(id=>{ const c=cue.cards.find(x=>x.id===id); if(c) c.starred=true; });
    localStorage.setItem(CUECARDS_KEY, JSON.stringify(cue));
    return true;
  }catch(e){ return false; }
}

function loadStats(){
  try{ const raw=localStorage.getItem(STATS_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return {totalXP:0, bestStreak:0, gamesPlayed:0};
}
function saveStats(s){ try{ localStorage.setItem(STATS_KEY, JSON.stringify(s)); }catch(e){} }
let stats = loadStats();

let cueBundle = readCueData();

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function truncate(s, n){ s=(s||'').replace(/\s+/g,' ').trim(); return s.length>n ? s.slice(0,n).trim()+'…' : s; }

/* ============ NAV / GAME STATE ============ */
let nav = {view:'setup'};
let setup = {courseId:null, scope:'all', mode:'mc', count:10};
let game = null; // {questions, index, hearts, streak, bestStreakThisGame, xp, wrongCards, answered}

function go(view){ nav={view}; render(); window.scrollTo(0,0); }

/* ============ RENDER DISPATCH ============ */
function render(){
  const app = document.getElementById('app');
  cueBundle = readCueData(); // always fresh
  if(nav.view==='setup') app.innerHTML = renderSetup();
  else if(nav.view==='playing') app.innerHTML = renderPlaying();
  else if(nav.view==='summary') app.innerHTML = renderSummary();
  bindEvents();
}

/* ============ SETUP SCREEN ============ */
function renderSetup(){
  const linked = cueBundle.source==='live';
  const hasData = !!cueBundle.data;
  const courses = hasData ? cueBundle.data.courses : [];
  if(!setup.courseId && courses.length) setup.courseId = courses[0].id;
  const course = courses.find(c=>c.id===setup.courseId);

  const badgeHTML = hasData
    ? `<div class="link-badge ${linked?'on':'off'}">
         <div class="dot"></div>
         <div class="t"><b>${linked?'Cue Cards에 자동 연결됨':'가져온 데이터 사용 중 (스냅샷)'}</b>${linked?'실시간으로 최신 카드를 불러와요':'같은 브라우저에서 Cue Cards를 열면 자동 연결돼요'}</div>
         <button id="btnReimport">다시 가져오기</button>
       </div>`
    : `<div class="link-badge off">
         <div class="dot"></div>
         <div class="t"><b>연결된 카드가 없어요</b>Cue Cards 앱에서 백업을 내보낸 뒤 가져와주세요</div>
         <button id="btnReimport">가져오기</button>
       </div>`;

  if(!hasData){
    return `
      <div class="content">
        <div class="hero"><h1>🎮 Quiz Quest</h1><p>카드로 배우고, 게임으로 복습해요</p></div>
        ${badgeHTML}
        <div class="empty"><div class="big">🔗</div>먼저 Cue Cards 데이터를 연결해주세요.<br>같은 브라우저에서 Cue Cards 앱을 한 번 열어두면 자동으로 연결돼요.</div>
      </div>`;
  }

  const cases = course ? cueBundle.data.cases.filter(x=>x.courseId===course.id) : [];
  const allCardsInCourse = course ? cueBundle.data.cards.filter(x=>x.courseId===course.id) : [];
  const starredInCourse = allCardsInCourse.filter(x=>x.starred);

  const courseRows = courses.map(co=>{
    const cnt = cueBundle.data.cards.filter(x=>x.courseId===co.id).length;
    return `<div class="card-select ${co.id===setup.courseId?'sel':''}" data-pick-course="${co.id}">
      <div class="dot" style="background:${co.color}"></div>
      <div class="body"><div class="name">${esc(co.name)}</div><div class="meta">카드 ${cnt}개</div></div>
      <div class="check"></div>
    </div>`;
  }).join('');

  const scopeOptions = [
    {key:'all', label:'전체', count:allCardsInCourse.length},
    {key:'starred', label:'즐겨찾기만', count:starredInCourse.length},
  ].concat(cases.map(cs=>({key:'case:'+cs.id, label:cs.name, count:cueBundle.data.cards.filter(x=>x.caseId===cs.id).length})));

  const scopeRows = scopeOptions.map(o=>`
    <div class="card-select ${setup.scope===o.key?'sel':''}" data-pick-scope="${o.key}" style="padding:11px 14px;">
      <div class="body"><div class="name" style="font-size:13px;">${esc(o.label)}</div><div class="meta">카드 ${o.count}개</div></div>
      <div class="check"></div>
    </div>`).join('');

  const pool = getScopedCards(course ? course.id : null, setup.scope);
  const maxCount = pool.length;
  const counts = [5,10,15].filter(n=>n<maxCount).concat([maxCount]);
  const uniqueCounts = [...new Set(counts)].filter(n=>n>0);

  return `
    <div class="content">
      <div class="hero"><h1>🎮 Quiz Quest</h1><p>카드로 배우고, 게임으로 복습해요</p></div>
      ${badgeHTML}

      <div class="stats-row">
        <div class="stat-chip"><div class="v">${stats.totalXP}</div><div class="l">총 XP</div></div>
        <div class="stat-chip"><div class="v">🔥${stats.bestStreak}</div><div class="l">최고 연속</div></div>
        <div class="stat-chip"><div class="v">${stats.gamesPlayed}</div><div class="l">플레이 횟수</div></div>
      </div>

      <div class="section-title">과목 선택</div>
      ${courseRows}

      <div class="section-title">범위 선택</div>
      ${scopeRows}

      <div class="section-title">게임 모드</div>
      <div class="mode-grid">
        <div class="mode-btn ${setup.mode==='mc'?'sel':''}" data-pick-mode="mc"><span class="ic">🎯</span>객관식</div>
        <div class="mode-btn ${setup.mode==='sa'?'sel':''}" data-pick-mode="sa"><span class="ic">✍️</span>주관식<br><span style="font-size:9.5px;font-weight:600;">AI 채점</span></div>
        <div class="mode-btn ${setup.mode==='mix'?'sel':''}" data-pick-mode="mix"><span class="ic">🎲</span>혼합</div>
      </div>

      <div class="section-title">문제 수</div>
      <div class="count-row">
        ${uniqueCounts.map(n=>`<div class="count-btn ${setup.count===n?'sel':''}" data-pick-count="${n}">${n===maxCount?'전체 '+n:n}</div>`).join('')}
      </div>

      <button class="start-btn" id="btnStart" ${maxCount<2?'disabled':''}>${maxCount<2 ? '카드가 부족해요 (2개 이상 필요)' : '▶ 시작하기'}</button>
    </div>
  `;
}

function getScopedCards(courseId, scope){
  if(!cueBundle.data || !courseId) return [];
  const all = cueBundle.data.cards.filter(x=>x.courseId===courseId);
  if(scope==='all') return all;
  if(scope==='starred') return all.filter(x=>x.starred);
  if(scope.startsWith('case:')){ const cid=scope.slice(5); return all.filter(x=>x.caseId===cid); }
  return all;
}

/* ============ BUILD QUESTIONS ============ */
function buildQuestions(){
  const course = cueBundle.data.courses.find(c=>c.id===setup.courseId);
  let pool = getScopedCards(course.id, setup.scope);
  pool = shuffle(pool).slice(0, setup.count);
  const wholeCourse = cueBundle.data.cards.filter(x=>x.courseId===course.id);

  return pool.map(card=>{
    let type = setup.mode;
    if(setup.mode==='mix') type = Math.random()<0.5 ? 'mc' : 'sa';
    if(type==='mc'){
      let distractPool = wholeCourse.filter(x=>x.id!==card.id);
      const distractors = shuffle(distractPool).slice(0,3);
      const options = shuffle([card, ...distractors]).map(c=>({id:c.id, text: truncate(c.back, 90), correct: c.id===card.id}));
      return {card, type:'mc', options};
    }
    return {card, type:'sa'};
  });
}

/* ============ PLAYING SCREEN ============ */
function startGame(){
  const questions = buildQuestions();
  if(questions.length<1){ return; }
  game = {questions, index:0, hearts:5, streak:0, bestStreakThisGame:0, xp:0, wrongCards:[], answeredThisQ:false, unlimitedHearts:false};
  go('playing');
}

function renderPlaying(){
  if(!game){ go('setup'); return ''; }
  const q = game.questions[game.index];
  const pct = Math.round((game.index/game.questions.length)*100);
  const heartsHTML = Array.from({length:5}).map((_,i)=> i<game.hearts ? '❤️' : '🤍').join('');

  let body = '';
  if(q.type==='mc'){
    const shapes = ['▲','◆','●','■'];
    body = `<div class="mc-grid" id="mcGrid">
      ${q.options.map((o,i)=>`<button class="mc-opt c${i+1}" data-opt="${o.id}" data-correct="${o.correct}">
        <span class="shape">${shapes[i]}</span><span>${esc(o.text)}</span>
      </button>`).join('')}
    </div>`;
  } else {
    body = `<div class="sa-box">
      <textarea id="saInput" placeholder="답을 적어보세요... (짧은 답변도, IRAC 스타일도 괜찮아요)"></textarea>
      <button class="sa-submit" id="saSubmit" disabled>제출하기</button>
    </div>`;
  }

  return `
    <div class="hud">
      <div class="back" id="btnQuit">✕</div>
      <div class="barwrap"><div class="barfill" style="width:${pct}%"></div></div>
      <div class="hearts">${heartsHTML}</div>
      <div class="streak">🔥${game.streak}</div>
    </div>
    <div class="content">
      <div class="stage">
        <div class="q-eyebrow">${game.index+1} / ${game.questions.length} · ${q.type==='mc'?'객관식':'주관식'}</div>
        <div class="q-card">
          <div style="position:absolute;top:-18px;right:-6px;">${mascotSVG('thinking',52)}</div>
          <div class="txt">${esc(q.card.front)}</div>
        </div>
        ${body}
      </div>
    </div>
  `;
}

/* ============ MC ANSWER HANDLING ============ */
function handleMCAnswer(optId, correct, btnEl){
  if(game.answeredThisQ) return;
  game.answeredThisQ = true;
  document.querySelectorAll('.mc-opt').forEach(b=>{
    b.style.pointerEvents='none';
    if(b.dataset.correct==='true') b.classList.add('correct-flash');
    if(b===btnEl && !correct) b.classList.add('wrong-flash');
    if(b!==btnEl && b.dataset.correct!=='true') b.classList.add('dim');
  });
  setTimeout(()=> resolveAnswer(correct, null), 550);
}

/* ============ SHORT ANSWER HANDLING ============ */
async function handleSAAnswer(){
  const val = document.getElementById('saInput').value.trim();
  if(!val) return;
  const q = game.questions[game.index];
  document.querySelector('.stage').innerHTML = `<div class="grading-wrap"><div class="spin"></div>AI가 채점하고 있어요...</div>`;

  let gradeResult = null;
  try{
    gradeResult = await gradeShortAnswer(q.card.front, q.card.back, val);
  }catch(e){ gradeResult = null; }

  if(gradeResult){
    const correct = gradeResult.score >= 60;
    resolveAnswer(correct, gradeResult);
  } else {
    showSelfGrade(q.card.back);
  }
}

async function gradeShortAnswer(question, reference, studentAnswer){
  const prompt = `You are grading a law student's short-answer response for a quick study game. Be encouraging but honest — this is a low-stakes review tool, not an exam.

Question: ${question}

Reference (correct) answer: ${reference}

Student's answer: ${studentAnswer}

Judge whether the student's answer captures the key point(s) of the reference answer. Give credit for correct substance even with very different wording or a shorter IRAC-style response. Flag it if a clearly important element is missing or wrong.

Respond with ONLY a JSON object, no other text, no markdown code fences, in exactly this shape:
{"score": <integer 0-100>, "verdict": "excellent"|"good"|"partial"|"incorrect", "feedback": "<1-2 short encouraging sentences in Korean>"}`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{ role: "user", content: prompt }]
    })
  });
  if(!response.ok) throw new Error('api error');
  const data = await response.json();
  const textBlock = (data.content||[]).find(b=>b.type==='text');
  if(!textBlock) throw new Error('no text');
  const clean = textBlock.text.replace(/```json|```/g,'').trim();
  const parsed = JSON.parse(clean);
  if(typeof parsed.score !== 'number') throw new Error('bad shape');
  return parsed;
}

function showSelfGrade(referenceBack){
  document.querySelector('.stage').innerHTML = `
    <div class="q-card" style="margin-bottom:12px;">
      <div class="fb-detail" style="border:none;padding:0;width:100%;">
        <div class="lbl">정답 / 모범답안</div>
        <div style="font-size:13.5px;white-space:pre-wrap;">${esc(referenceBack)}</div>
      </div>
    </div>
    <div class="ai-fail-note">⚠️ AI 채점을 사용할 수 없어요 (Claude 안에서 이 앱을 열었을 때만 자동 채점이 가능해요). 직접 비교해서 판단해주세요.</div>
    <div class="self-grade-row">
      <button class="sg-yes" id="sgYes">✓ 맞았어요</button>
      <button class="sg-no" id="sgNo">✗ 틀렸어요</button>
    </div>
  `;
  document.getElementById('sgYes').onclick=()=> resolveAnswer(true, {score:100, verdict:'self', feedback:'스스로 채점했어요 — 잘하셨어요!'});
  document.getElementById('sgNo').onclick=()=> resolveAnswer(false, {score:0, verdict:'self', feedback:'스스로 채점했어요 — 다음엔 더 잘할 거예요!'});
}

/* ============ RESOLVE / FEEDBACK ============ */
function resolveAnswer(correct, aiResult){
  const q = game.questions[game.index];
  let xpGain = 0;
  if(correct){
    game.streak++;
    game.bestStreakThisGame = Math.max(game.bestStreakThisGame, game.streak);
    const mult = game.streak>=5 ? 2 : game.streak>=3 ? 1.5 : 1;
    xpGain = Math.round((q.type==='mc' ? 10 : (aiResult ? Math.max(10, Math.round(aiResult.score/100*20)) : 15)) * mult);
    game.xp += xpGain;
    sound('correct'); burstConfetti();
  } else {
    game.streak = 0;
    if(!game.unlimitedHearts) game.hearts = Math.max(0, game.hearts-1);
    game.wrongCards.push(q.card.id);
    sound('wrong');
  }
  showFeedback(correct, xpGain, aiResult, q);
}

function showFeedback(correct, xpGain, aiResult, q){
  const overlay = document.getElementById('fbOverlay');
  const sheet = document.getElementById('fbSheet');
  sheet.className = 'fb-sheet ' + (correct?'good':'bad');

  const heading = correct
    ? ['정답이에요!','완벽해요!','바로 그거예요!','최고예요!'][Math.floor(Math.random()*4)]
    : ['아쉬워요!','다시 한번!','괜찮아요!','조금만 더!'][Math.floor(Math.random()*4)];

  let detailHTML = '';
  if(aiResult && aiResult.feedback){
    detailHTML = `<div class="fb-detail"><div class="lbl">${aiResult.verdict==='self'?'셀프 채점':'AI 피드백'}</div>${esc(aiResult.feedback)}</div>`;
  }
  if(!correct){
    detailHTML += `<div class="fb-detail"><div class="lbl">정답 / 모범답안</div><div style="white-space:pre-wrap;">${esc(q.card.back)}</div></div>`;
  }

  sheet.innerHTML = `
    <div class="fb-top">
      <div class="mascot">${mascotSVG(correct?'happy':'sad',56)}</div>
      <div class="msg"><div class="h">${heading}</div><div class="s">${correct?('하트 유지 · 연속 '+game.streak):'하트 -1'}</div></div>
    </div>
    ${xpGain>0 ? `<div class="fb-xp">⭐ +${xpGain} XP</div>` : ''}
    ${detailHTML}
    <button class="fb-next" id="btnNextQ">${game.index<game.questions.length-1?'다음 문제 →':'결과 보기 →'}</button>
  `;
  overlay.classList.add('show');
  document.getElementById('btnNextQ').onclick = nextQuestion;

  if(game.hearts<=0 && !game.unlimitedHearts){
    setTimeout(()=>{
      if(confirm('하트를 다 썼어요! 그래도 계속할까요? (계속하면 하트 걱정 없이 끝까지 풀 수 있어요)')){
        game.unlimitedHearts = true;
      }
    }, 300);
  }
}

function nextQuestion(){
  document.getElementById('fbOverlay').classList.remove('show');
  if(game.index < game.questions.length-1){
    game.index++;
    game.answeredThisQ = false;
    render();
  } else {
    finishGame();
  }
}

function finishGame(){
  stats.totalXP += game.xp;
  stats.bestStreak = Math.max(stats.bestStreak, game.bestStreakThisGame);
  stats.gamesPlayed += 1;
  saveStats(stats);
  go('summary');
}

/* ============ SUMMARY SCREEN ============ */
function renderSummary(){
  if(!game){ go('setup'); return ''; }
  const total = game.questions.length;
  const correctCount = total - new Set(game.wrongCards).size >= 0 ? (total - [...new Set(game.wrongCards)].length) : 0;
  const acc = Math.round((correctCount/total)*100);
  const wrongUnique = [...new Set(game.wrongCards)].map(id => cueBundle.data.cards.find(c=>c.id===id)).filter(Boolean);

  const wrongHTML = wrongUnique.length ? `<div class="wrong-list">
    ${wrongUnique.map(c=>`<div class="wrong-item"><div class="f">${esc(c.front)}</div><div class="b">${esc(truncate(c.back,80))}</div></div>`).join('')}
  </div>` : `<div class="empty" style="padding:20px;"><div class="big">🎉</div>다 맞았어요!</div>`;

  return `
    <div class="content">
      <div class="summary-hero">
        <div class="mascot-big">${mascotSVG(acc>=70?'happy':'neutral',110)}</div>
        <h2>${acc>=90?'완벽한 라운드!':acc>=70?'잘했어요!':'수고했어요!'}</h2>
      </div>
      <div class="summary-grid">
        <div class="summary-stat"><div class="v">⭐${game.xp}</div><div class="l">획득 XP</div></div>
        <div class="summary-stat"><div class="v">${acc}%</div><div class="l">정답률</div></div>
        <div class="summary-stat"><div class="v">🔥${game.bestStreakThisGame}</div><div class="l">최고 연속</div></div>
        <div class="summary-stat"><div class="v">${wrongUnique.length}</div><div class="l">복습 필요</div></div>
      </div>
      <div class="section-title">틀린 카드 ${wrongUnique.length>0?'('+wrongUnique.length+'개)':''}</div>
      ${wrongHTML}
      <div class="summary-btns">
        ${wrongUnique.length ? `<button class="btn-star-all" id="btnStarWrong">★ 틀린 카드 즐겨찾기에 추가하기</button>` : ''}
        <button class="btn-replay" id="btnReplay">🔁 다시 하기</button>
        <button class="btn-home" id="btnHome">홈으로</button>
      </div>
    </div>
  `;
}

/* ============ IMPORT SHEET ============ */
function openSheet(html){ document.getElementById('sheet').innerHTML=html; document.getElementById('overlay').classList.add('show'); }
function closeSheet(){ document.getElementById('overlay').classList.remove('show'); }
function sheetImport(){
  openSheet(`
    <div class="sheet-hd"><h3>Cue Cards 데이터 가져오기</h3><div class="x" id="sheetClose">✕</div></div>
    <div style="font-size:12px;color:var(--ink2);margin-bottom:12px;">Cue Cards 앱의 설정 &gt; 백업 내보내기로 받은 JSON 파일을 올려주세요. 같은 브라우저에서 Cue Cards를 열어두면 이 단계 없이 자동으로 연결돼요.</div>
    <button class="btn-primary" id="btnPickFile" style="width:100%;border-radius:14px;padding:13px;font-weight:800;">파일 선택</button>
    <input type="file" id="importFile" accept="application/json">
    <div class="field" style="margin-top:14px;"><textarea id="pasteArea" placeholder="또는 JSON을 여기에 붙여넣기..."></textarea></div>
    <div class="sheet-btns"><button class="btn-primary" id="btnUsePaste" style="width:100%;">붙여넣은 내용 사용</button></div>
  `);
  document.getElementById('sheetClose').onclick = closeSheet;
  document.getElementById('btnPickFile').onclick = ()=> document.getElementById('importFile').click();
  document.getElementById('importFile').onchange = (e)=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{ tryImportJSON(reader.result); };
    reader.readAsText(file);
  };
  document.getElementById('btnUsePaste').onclick = ()=>{ tryImportJSON(document.getElementById('pasteArea').value); };
}
function tryImportJSON(text){
  try{
    const data = JSON.parse(text);
    if(!data.courses || !data.cases || !data.cards) throw new Error('bad shape');
    saveSnapshot(data);
    closeSheet(); render();
  }catch(e){ alert('가져오기에 실패했어요 — JSON 형식을 확인해주세요.'); }
}

/* ============ EVENTS ============ */
function bindEvents(){
  const app = document.getElementById('app');
  const on = (id, fn) => { const el=document.getElementById(id); if(el) el.onclick = fn; };

  on('btnReimport', sheetImport);
  on('btnStart', startGame);
  on('btnQuit', ()=>{ if(confirm('게임을 종료할까요? 진행 상황은 저장되지 않아요.')) go('setup'); });
  on('btnReplay', ()=> startGame());
  on('btnHome', ()=> go('setup'));
  on('btnStarWrong', ()=>{
    const ok = writeBackStars([...new Set(game.wrongCards)]);
    alert(ok ? '즐겨찾기에 추가했어요! Cue Cards에서 확인해보세요.' : '연결된 Cue Cards 데이터가 없어서 저장하지 못했어요.');
  });

  app.querySelectorAll('[data-pick-course]').forEach(el=> el.onclick=()=>{ setup.courseId=el.dataset.pickCourse; setup.scope='all'; render(); });
  app.querySelectorAll('[data-pick-scope]').forEach(el=> el.onclick=()=>{ setup.scope=el.dataset.pickScope; render(); });
  app.querySelectorAll('[data-pick-mode]').forEach(el=> el.onclick=()=>{ setup.mode=el.dataset.pickMode; render(); });
  app.querySelectorAll('[data-pick-count]').forEach(el=> el.onclick=()=>{ setup.count=parseInt(el.dataset.pickCount,10); render(); });

  app.querySelectorAll('.mc-opt').forEach(el=>{
    el.onclick=()=>{ sound('tap'); handleMCAnswer(el.dataset.opt, el.dataset.correct==='true', el); };
  });
  const saInput = document.getElementById('saInput');
  if(saInput){
    saInput.addEventListener('input', ()=>{
      document.getElementById('saSubmit').disabled = !saInput.value.trim();
    });
  }
  on('saSubmit', handleSAAnswer);

  document.getElementById('overlay').onclick=(e)=>{ if(e.target.id==='overlay') closeSheet(); };
}

render();
</script>
